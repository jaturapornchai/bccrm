name: bccrm_mobile
description: "BCCRM — แอปพนักงาน/เจ้าของร้าน + Kiosk หน้าร้าน (Android/iOS/แท็บเล็ต)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # เรียก API หลังบ้าน
  dio: ^5.7.0
  # realtime คิว (เชื่อม socket.io ของ API)
  socket_io_client: ^2.0.3+1
  # state management
  flutter_riverpod: ^2.6.0
  # เก็บ token/session ในเครื่อง
  shared_preferences: ^2.3.0
  # พิมพ์บัตรคิว thermal (ESC/POS) ผ่าน Bluetooth/LAN — สำหรับ kiosk
  esc_pos_printer: ^4.1.0
  esc_pos_utils: ^1.1.0
  # สแกน QR check-in หน้าร้าน
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
